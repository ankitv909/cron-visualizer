name: Security dependency repair

on:
  push:
    branches: [security/npm-audit-fix]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: security/npm-audit-fix

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix --package-lock-only || true

      - name: Install repaired dependency tree
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency file changes were produced."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "chore: apply npm audit dependency fixes"
          git push origin HEAD:security/npm-audit-fix
